name: Screeps World W37S79 spawn readiness (GET only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screeps-world-w37s79-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify fail-closed readiness tests
        run: node world-next-spawn-readiness.test.mjs
      - name: Check W37S79 exact code and spawn readiness (GET only)
        env:
          SCREEPS_TOKEN_WORLD: ${{ secrets.SCREEPS_TOKEN_WORLD }}
          WORLD_NEXT_READINESS_OUTPUT_DIR: ${{ runner.temp }}/world-w37s79-readiness
        run: node world-next-spawn-readiness.mjs
      - name: Preserve sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screeps-world-W37S79-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/world-w37s79-readiness/W37S79-readiness.json
          if-no-files-found: warn
          retention-days: 14
