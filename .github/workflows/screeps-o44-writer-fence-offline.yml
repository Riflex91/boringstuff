name: Screeps O44 cross-process Git ref writer fence (OFFLINE)
on:
  push:
    branches: [safety/o44-github-ref-world-writer-fence-20261017]
permissions:
  contents: read
concurrency:
  group: o44-offline-writer-fence-test
  cancel-in-progress: false
jobs:
  no-write-node24-p3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Pin Main predecessor and assert all gameplay files identical
        shell: bash
        run: |
          git -C .. fetch origin main --quiet
          test "$(git -C .. rev-parse origin/main)" = bc43f2faf1f345e63d9bfe78b6bbaa59e5eaab0c
          git -C .. diff --exit-code origin/main HEAD -- game
      - name: Full Node24 O39 through O44 safety regressions
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm test
      - name: P3 exact benchmark results
        run: npm run bench:p3
      - name: Document non-authorizing remote-lock test boundary
        run: |
          echo '### O44 independent-writer exclusion rehearsal' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub tag-object and fixed-ref operations used only mock transports; no GitHub ref was actually created/deleted in CI.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Screeps API tokens or calls. No code POST, release approval, spawn, branch activation or merge.' >> "$GITHUB_STEP_SUMMARY"
          echo 'External writers must opt into the same lock; World legacy deploy-live.mjs remains fail-closed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Main release blocker: HOLD_EXACT_PREDECESSOR_PAIR_MISSING.' >> "$GITHUB_STEP_SUMMARY"
