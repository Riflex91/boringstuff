name: Screeps D8 combat settlement evidence review (NO DEPLOY)
on:
  push:
    branches: [feature/d8-authenticated-combat-settlement-20261020]
permissions:
  contents: read
jobs:
  exact-head-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Exact D7 Main predecessor and bounded read-only delta
        shell: bash
        run: |
          git -C .. fetch origin main --quiet
          test "$(git -C .. rev-parse origin/main)" = 0b07dda51c4ebe15d4706133b1c98b1cd3a90f28
          actual="$(git -C .. diff --name-only origin/main HEAD -- game | sort)"
          expected="$(printf '%s\n' game/defense.combat.settlement.js game/main.js | sort)"
          test "$actual" = "$expected"
          grep -Eq 'AUTO_SAFE_MODE:[[:space:]]*true' ../game/config.js
          grep -Eq 'ENABLE_PARALLEL_SPAWN_EXECUTION:[[:space:]]*true' ../game/config.js
          if grep -E '(\.attack[[:space:]]*\(|\.heal[[:space:]]*\(|\.repair[[:space:]]*\(|\.spawnCreep[[:space:]]*\(|\.createConstructionSite[[:space:]]*\()' ../game/defense.combat.settlement.js; then
            echo 'D8 observer may not issue gameplay actions' >&2
            exit 1
          fi
      - name: Full Node24 canonical regression tests
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm test
      - name: Original P3 four-mode benchmark
        run: npm run bench:p3
      - name: No deployment
        run: |
          echo 'D8 review-only: no Screeps tokens, credentials or API writes'
