name: Screeps World W37S79 candidate preflight (GET only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screeps-world-w37s79-readonly
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: node --check world-next-target-preflight.mjs
      - name: Read-only W37S79 live check
        env:
          SCREEPS_TOKEN_WORLD: ${{ secrets.SCREEPS_TOKEN_WORLD }}
          WORLD_NEXT_PREFLIGHT_OUTPUT_DIR: ${{ runner.temp }}/world-next-target
        run: node world-next-target-preflight.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screeps-world-W37S79-get-only-${{ github.sha }}
          path: ${{ runner.temp }}/world-next-target/W37S79-preflight.json
          if-no-files-found: warn
          retention-days: 14
