name: Screeps World W37S79 activate verified staged code (manual)
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        required: true
        type: string
        description: Exact tested main SHA
      activation_approval:
        required: true
        type: string
        description: Type ACTIVATE_W37S79_VERIFIED_SPAWN_STAGE
permissions:
  contents: read
concurrency:
  group: screeps-world-chatgpt
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools
    env:
      WORLD_W37S79_ACTIVATION_APPROVAL: ${{ inputs.activation_approval }}
      SCREEPS_TOKEN_WORLD: ${{ secrets.SCREEPS_TOKEN_WORLD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact main and explicit activation authorization
        env:
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = refs/heads/main
          test "$WORLD_W37S79_ACTIVATION_APPROVAL" = ACTIVATE_W37S79_VERIFIED_SPAWN_STAGE
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Full tests and P3 benchmark
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm test
          npm run bench:p3
      - name: Activate only exact staged code after owned Spawn1 readback
        run: node world-next-activate-spawn.mjs
