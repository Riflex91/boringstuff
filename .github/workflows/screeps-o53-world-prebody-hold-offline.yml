name: Screeps O53 pre-body World guard parameters and O45 source pin (OFFLINE)
on:
  push:
    branches: [safety/o53-prebody-parameters-hold-integrity-20261017]
permissions:
  contents: read
concurrency:
  group: o53-offline-world-hold-integrity
  cancel-in-progress: false
jobs:
  node24-p3-no-write:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Pin Main and prove byte-identical gameplay modules
        shell: bash
        run: |
          git -C .. fetch origin main --quiet
          test "$(git -C .. rev-parse origin/main)" = bc43f2faf1f345e63d9bfe78b6bbaa59e5eaab0c
          git -C .. diff --exit-code origin/main HEAD -- game
      - name: Canonical Node24 O39–O53 tests
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm test
      - name: Original exact P3 reproducibility
        run: npm run bench:p3
      - name: Record no-write O53 limits
        run: |
          echo '### O53 independent source pin and pre-body effects audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'The reviewed unconditional O45 HOLD implementation is pinned to a fixed Git blob.' >> "$GITHUB_STEP_SUMMARY"
          echo 'World legacy exports reject default expression side effects and destructuring before the first HOLD statement.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Screeps secrets, World HTTP/WS production mutation, GitHub writer ref mutation or Main merge.' >> "$GITHUB_STEP_SUMMARY"
          echo 'HOLD_EXACT_PREDECESSOR_PAIR_MISSING.' >> "$GITHUB_STEP_SUMMARY"
