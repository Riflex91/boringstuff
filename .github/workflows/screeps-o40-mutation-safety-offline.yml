name: Screeps O40 mutation POST no-replay and GET-only reconciliation (OFFLINE)
on:
  push:
    branches: [safety/o40-world-mutation-transport-get-reconcile-20261017]
permissions:
  contents: read
concurrency:
  group: o40-offline-mutation-regression
  cancel-in-progress: false
jobs:
  node24-and-p3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Assert predecessor Main and no game module modifications
        shell: bash
        run: |
          git -C .. fetch origin main --quiet
          test "$(git -C .. rev-parse origin/main)" = bc43f2faf1f345e63d9bfe78b6bbaa59e5eaab0c
          git -C .. diff --exit-code origin/main HEAD -- game
      - name: Full canonical Node24 tests including localhost O39/O40 regressions
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm test
      - name: Paired four-run P3 baseline equality
        run: npm run bench:p3
      - name: Record strictly offline results
        run: |
          echo '### O40 read-only development results' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Screeps secret, branch activation, game-code POST, respawn, release or merge.' >> "$GITHUB_STEP_SUMMARY"
          echo 'World workflows already share a repository-local writer group; external writers remain outside this GitHub lock.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unknown code POST outcome remains HOLD even when GET bytes match.' >> "$GITHUB_STEP_SUMMARY"
