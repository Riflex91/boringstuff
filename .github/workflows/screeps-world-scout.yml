name: Screeps World strategic scouting (read-only)
on:
  workflow_dispatch:
    inputs:
      max_per_shard:
        description: Read-only probes per shard (manual default 96; push default 24)
        required: true
        type: choice
        default: '96'
        options: ['24', '48', '96']
  # Legacy first-spawn workflow: manual only after World activation.
  # Do not misclassify a correctly occupied World colony as launch failure.
permissions:
  contents: read
concurrency:
  group: screeps-world-scout-readonly
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Run GET-only per-shard strategic spawn planner
        env:
          SCREEPS_TOKEN_WORLD: ${{ secrets.SCREEPS_TOKEN_WORLD }}
          WORLD_SCOUT_OUTPUT_DIR: ${{ runner.temp }}/world-scout-results
          WORLD_SCOUT_MAX_PER_SHARD: ${{ inputs.max_per_shard || '24' }}
        run: node world-scout.mjs
      - name: Retain read-only scouting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screeps-world-scout-${{ github.sha }}
          path: ${{ runner.temp }}/world-scout-results
          if-no-files-found: warn
          retention-days: 14
